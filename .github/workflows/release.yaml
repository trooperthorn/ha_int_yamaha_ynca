name: Create release from tag
permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - run: |
          echo Checkout done for $GITHUB_REF

      - name: Zip every custom_components/* dir
        # This repo now hosts more than one integration (yamaha_ynca,
        # yamaha_ync). Building a zip per subdirectory -- rather than
        # assuming there's exactly one -- keeps yamaha_ynca's asset name
        # (yamaha_ynca.zip, what hacs.json's zip_release config expects)
        # stable regardless of how many integrations end up living here.
        run: |
          for dir in custom_components/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../${name}.zip" ./*)
            echo "Built ${name}.zip"
          done

      - name: Create Release
        # Started from: https://stackoverflow.com/questions/75679683/how-can-i-auto-generate-a-release-note-and-create-a-release-using-github-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        # --discussion-category "General" not possible for draft releases :/
        run: |
          gh release create "$tag" ./*.zip \
              --repo="$GITHUB_REPOSITORY" \
              --title="$tag" \
              --generate-notes \
              --draft
