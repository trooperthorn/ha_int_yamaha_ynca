blueprint:
  name: Yamaha Zone Handoff to Monoprice Amplifier
  description: >
    For a Yamaha zone with no amplifier of its own (Zone 4 on the RX-A3080 --
    confirmed via Volume_Existence: Not Exist -- or any zone routed through
    an external amp), turn on a Monoprice zone and select its source
    whenever the Yamaha zone is powered on. Opt-in via a helper toggle so it
    never fires unless you've turned it on for that zone.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_yamaha_ynca
  input:
    yamaha_zone_player:
      name: Yamaha zone media_player
      description: The line-out-only Yamaha zone (e.g. Zone 4 / Kitchen).
      selector:
        entity:
          domain: media_player
    enable_helper:
      name: Enable auto-routing (input_boolean)
      description: >
        Automation only acts while this is on -- "if the user chooses it."
      selector:
        entity:
          domain: input_boolean
    monoprice_player:
      name: Monoprice zone media_player
      selector:
        entity:
          domain: media_player
    monoprice_source:
      name: Monoprice source to select
      description: The Monoprice input carrying this Yamaha zone's line-out.
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input yamaha_zone_player
    to: "on"

condition:
  - condition: state
    entity_id: !input enable_helper
    state: "on"

action:
  - service: media_player.turn_on
    target:
      entity_id: !input monoprice_player
  - service: media_player.select_source
    target:
      entity_id: !input monoprice_player
    data:
      source: !input monoprice_source

mode: single
